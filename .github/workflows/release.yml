name: Release

# Builds every package and publishes them together with a pacman repository
# database as release assets. Each release is self-contained: the .db indexes
# exactly the packages uploaded alongside it, so
# https://github.com/OWNER/REPO/releases/latest/download is a valid, stable
# pacman Server URL that always resolves to the newest release.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/build.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm git github-cli pacman-contrib python sudo

      - uses: actions/checkout@v4

      # makepkg refuses to run as root, and the container starts as root.
      - name: Create an unprivileged build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder .

      - name: Build packages and repository database
        run: sudo --user=builder ./scripts/build.sh

      - name: Derive the release version
        id: version
        run: |
          version="$(sed -n 's/^pkgver=//p' packages/cuttlefish-base-bin/PKGBUILD)"
          release="$(sed -n 's/^pkgrel=//p' packages/cuttlefish-base-bin/PKGBUILD)"
          echo "version=${version}-${release}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, gh resolves the repository by shelling out to git,
          # which refuses the checkout as "dubious ownership": the build step
          # chowns it to the unprivileged build user.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ steps.version.outputs.version }}"

          # Re-running for the same version replaces the assets rather than
          # failing, so a rebuild is never blocked by a half-finished release.
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --title "Cuttlefish ${{ steps.version.outputs.version }}" \
              --notes "Arch packages repackaged from Google's official \
          Cuttlefish .deb ${{ steps.version.outputs.version }}.

          Add to \`/etc/pacman.conf\`:

          \`\`\`ini
          [cuttlefish]
          SigLevel = Optional TrustAll
          Server = https://github.com/${{ github.repository }}/releases/latest/download
          \`\`\`"
          fi
