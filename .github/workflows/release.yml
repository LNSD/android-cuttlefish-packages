name: Release

# Builds every package and publishes them together with a pacman repository
# database as release assets. Each release is self-contained: the .db indexes
# exactly the packages uploaded alongside it, so
# https://github.com/OWNER/REPO/releases/latest/download is a valid, stable
# pacman Server URL that always resolves to the newest release.
#
# Everything below is automated at release time: signing, SBOM generation and
# provenance attestation all happen in this job. The only manual prerequisites
# are the two GPG secrets, set once.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/build.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  # Both required by the attestation actions: id-token to obtain the Sigstore
  # OIDC token, attestations to write into the repository's attestation store.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm git github-cli pacman-contrib python sudo syft

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # makepkg refuses to run as root, and the container starts as root.
      - name: Create an unprivileged build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder .

      - name: Build
        run: sudo --user=builder ./scripts/build.sh

      - name: Import the signing subkey
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}

      # Runs as root, which owns the keyring the step above imported into.
      - name: Sign the packages and the database
        env:
          SIGNING_KEY: ${{ steps.gpg.outputs.keyid }}
        run: ./scripts/sign.sh

      # syft reads Go module metadata out of the Go binaries (host_orchestrator,
      # operator). The C++ components are statically linked, so their contents
      # are not visible to any scanner -- see README.
      - name: Generate SBOM
        run: syft scan dir:dist --output spdx-json=dist/android-cuttlefish.spdx.json

      # Attests that these artifacts were built by this workflow, from this
      # commit. It says nothing about Google's binaries inside them; that link
      # is the .deb sha256 verified against the upstream index by resolve-deb.py.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.pkg.tar.zst

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.pkg.tar.zst
          sbom-path: dist/android-cuttlefish.spdx.json

      - name: Derive the release version
        id: version
        run: |
          version="$(sed -n 's/^pkgver=//p' packages/cuttlefish-base-bin/PKGBUILD)"
          release="$(sed -n 's/^pkgrel=//p' packages/cuttlefish-base-bin/PKGBUILD)"
          echo "version=${version}-${release}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, gh resolves the repository by shelling out to git,
          # which refuses the checkout as "dubious ownership": the build step
          # chowns it to the unprivileged build user.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          repo="${{ github.repository }}"

          # Releases in this repository are immutable: once one is published,
          # its assets and its tag are locked. A version is therefore published
          # exactly once, and a re-run for a version that already exists has
          # nothing it is allowed to do.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::${tag} is already published, and releases are immutable, so its assets cannot be replaced. Bump pkgrel to publish new artifacts."
            exit 0
          fi

          # Each paragraph is one long line on purpose. GitHub renders release
          # notes with hard line breaks, so a wrapped paragraph is displayed
          # with the wrap points in it. Do not reflow these to 72 columns.
          cat > notes.md <<EOF
          Arch packages repackaged from Google's official Cuttlefish .deb ${{ steps.version.outputs.version }}.

          Packages and the database are GPG-signed, carry an SBOM, and have a SLSA provenance attestation.

          ## Install

          Add to \`/etc/pacman.conf\`:

          \`\`\`ini
          [android-cuttlefish]
          SigLevel = Required TrustAll
          Server = https://github.com/${repo}/releases/latest/download
          \`\`\`

          \`\`\`sh
          sudo pacman -Sy cuttlefish-base-bin cuttlefish-user-bin
          \`\`\`

          pacman offers to import the signing key on that first install. To pin trust to this key instead of using \`TrustAll\`, see the README.

          ## Verify

          \`\`\`sh
          gh attestation verify <package>.pkg.tar.zst --repo ${repo}
          \`\`\`
          EOF

          # Published as a draft first, then flipped live. Immutability locks
          # the assets at the moment of publication, so every asset has to be
          # attached before that, not after.
          gh release create "${tag}" dist/* \
            --draft \
            --title "Cuttlefish ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
          gh release edit "${tag}" --draft=false
